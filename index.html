<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sekar Agny</title>
    <script>
      window.__ERRORS__ = [];
      window.addEventListener('error', function(e) {
        window.__ERRORS__.push({ message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno, error: String(e.error && e.error.stack || e.error) });
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__ERRORS__.push({ reason: String(e.reason && e.reason.stack || e.reason) });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
